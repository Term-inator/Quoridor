[project]
name = "quoridor-rl"
version = "0.1.0"
description = "A tested two-player Quoridor environment for reinforcement learning"
readme = "README.md"
authors = [
    { name = "Term-inator", email = "1121745627@qq.com" }
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "gymnasium>=1.2.0",
    "numpy>=2.0.0",
    "pettingzoo>=1.26.1",
]

[project.optional-dependencies]
pygame = ["pygame-ce>=2.5.8,<3"]

[dependency-groups]
dev = [
    "hypothesis>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]
train = [
    "matplotlib>=3.10.0,<4",
    "tensorboard>=2.20.0,<3",
    "torch>=2.9.0,<3",
    "torchrl>=0.13.0,<0.14",
]

[project.scripts]
quoridor = "quoridor_rl.cli:main"
quoridor-pygame = "quoridor_rl.pygame_ui.entry:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[[tool.mypy.overrides]]
module = [
    "pettingzoo",
    "pettingzoo.*",
    "tensordict",
    "tensordict.*",
    "torchrl",
    "torchrl.*",
]
ignore_missing_imports = true
